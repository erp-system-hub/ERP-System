function logoPng(im,keepBg){let w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;let k=Math.min(1,256/Math.max(w,h));
  for(let t=0;t<8;t++){const W=Math.max(16,Math.round(w*k)),H=Math.max(16,Math.round(h*k)),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,W,H);
    if(!keepBg){const d=x.getImageData(0,0,W,H),p=d.data,seen=new Uint8Array(W*H),st=[];const wh=i=>p[i*4+3]>0&&p[i*4]>232&&p[i*4+1]>232&&p[i*4+2]>232;
      const push=i=>{if(!seen[i]&&wh(i)){seen[i]=1;st.push(i)}};for(let a=0;a<W;a++){push(a);push((H-1)*W+a)}for(let b=0;b<H;b++){push(b*W);push(b*W+W-1)}
      while(st.length){const i=st.pop(),a=i%W,b=(i-a)/W;p[i*4+3]=0;if(a>0)push(i-1);if(a<W-1)push(i+1);if(b>0)push(i-W);if(b<H-1)push(i+W)}
      x.putImageData(d,0,0)}
    const u=c.toDataURL('image/png');if(u.length<=44000)return u;k*=.8}return null}
function lg(fl){if(!fl)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const u=logoPng(im);if(!u){toast('الصورة كبيرة، استخدم رابط الشعار بدلًا منها',1);return}$('#sf [name=logo]').value=u;toast('تم تجهيز الشعار بخلفية شفافة، اضغط حفظ الإعدادات')};im.src=r.result};r.readAsDataURL(fl)}
A.lgbg=()=>{const v=($('#sf [name=logo]')||{}).value||S().logo;if(!v){toast('لا يوجد شعار',1);return}const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{const u=logoPng(im);if(!u){toast('الصورة كبيرة',1);return}$('#sf [name=logo]').value=u;toast('أُزيلت الخلفية البيضاء، اضغط حفظ الإعدادات')}catch(e){toast('تعذّر معالجة هذا الرابط؛ ارفع الصورة من جهازك',1)}};im.onerror=()=>toast('تعذّر قراءة الشعار',1);im.src=v}
</script>

(async()=>{

/* ---------- قوائم منسدلة قابلة للبحث بجزء من الكلمة ----------
   أي قائمة فيها أكثر من 6 خيارات تتحول تلقائيًا لحقل بحث (يتجاهل التشكيل والهمزات والتاء المربوطة).
   القائمة الأصلية (select) تبقى موجودة ومخفية فلا يتأثر باقي الكود. */
const nz=x=>String(x||'').toLowerCase().replace(/[ً-ٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
var ssAnc=null;
function ssClose(){if(ssOpen){ssOpen.remove();ssOpen=null}ssAnc=null}
function ssPlace(){if(!ssOpen||!ssAnc)return;const r=ssAnc.getBoundingClientRect();
  if(r.bottom<0||r.top>innerHeight){ssClose();return}
  const h=ssOpen.offsetHeight||240,below=innerHeight-r.bottom;
  ssOpen.style.top=(below<h+8&&r.top>below?Math.max(4,r.top-h-2):Math.min(r.bottom+2,innerHeight-120))+'px';
  ssOpen.style.right=Math.max(4,innerWidth-r.right)+'px'}
function ssEnhance(sel){
  if(sel.dataset.ss||sel.multiple||sel.options.length<=6||sel.closest('.ss'))return;
  sel.dataset.ss='1';
  const w=document.createElement('span');w.className='ss';
  const width=sel.offsetWidth||0;if(width)w.style.width=width+'px';else w.style.minWidth='180px';
  const inp=document.createElement('input');inp.type='text';inp.autocomplete='off';inp.placeholder='اكتب للبحث...';inp.disabled=sel.disabled;
  sel.parentNode.insertBefore(w,sel);w.appendChild(inp);w.appendChild(sel);sel.style.display='none';
  const lab=()=>{const o=sel.options[sel.selectedIndex];return o?o.textContent.trim():''};
  const sync=()=>{inp.value=lab();inp.disabled=sel.disabled};
  const proto=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
  Object.defineProperty(sel,'value',{get(){return proto.get.call(sel)},set(v){proto.set.call(sel,v);sync()},configurable:true});
  let act=-1,list=null,items=[];
  const pick=i=>{const o=items[i];if(!o)return;sel.selectedIndex=o.index;sync();ssClose();sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}))};
  const show=()=>{
    const q=nz(inp.dataset.q||'');
    items=[...sel.options].filter(o=>!o.disabled&&(!q||nz(o.textContent).includes(q)));
    ssClose();list=document.createElement('div');list.className='ssl';
    const r=inp.getBoundingClientRect();
    list.style.top=Math.min(r.bottom+2,innerHeight-120)+'px';list.style.right=Math.max(4,innerWidth-r.right)+'px';list.style.minWidth=Math.max(200,r.width)+'px';
    list.innerHTML=items.length?items.map((o,i)=>`<div data-i="${i}"${o.index===sel.selectedIndex?' class="on"':''}>${esc(o.textContent.trim())||'—'}</div>`).join(''):'<div class="no">لا توجد نتائج</div>';
    (inp.closest('dialog[open]')||document.body).appendChild(list);ssOpen=list;ssAnc=inp;ssPlace();
    act=Math.max(0,items.findIndex(o=>o.index===sel.selectedIndex));
    const el=list.children[act];if(el&&items.length){el.classList.add('on');el.scrollIntoView({block:'nearest'})}
    list.onmousedown=e=>{const d=e.target.closest('[data-i]');if(d){e.preventDefault();pick(+d.dataset.i)}};
  };
  const mark=()=>{[...list.children].forEach((c,i)=>c.classList.toggle('on',i===act));const c=list.children[act];if(c)c.scrollIntoView({block:'nearest'})};
  inp.addEventListener('focus',()=>{inp.dataset.q='';inp.select();show()});
  inp.addEventListener('click',()=>{if(!ssOpen){inp.dataset.q='';show()}});
  inp.addEventListener('input',()=>{inp.dataset.q=inp.value;show()});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!ssOpen){inp.dataset.q='';show();return}if(items.length){act=(act+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;mark()}}
    else if(e.key==='Enter'){if(ssOpen){e.preventDefault();e.stopPropagation();pick(act)}}
    else if(e.key==='Escape'){if(ssOpen){e.stopPropagation();e.preventDefault();ssClose();sync()}}
    else if(e.key==='Tab'){ssClose();sync()}
  });
  inp.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==inp){ssClose();sync()}},120));
  sel.addEventListener('change',sync);
  new MutationObserver(sync).observe(sel,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled','selected']});
  sync();
}
const ssScan=(root)=>{(root||document).querySelectorAll&&(root||document).querySelectorAll('select').forEach(ssEnhance)};
new MutationObserver(m=>{let go=false;m.forEach(x=>x.addedNodes.forEach(n=>{if(n.nodeType===1&&(n.tagName==='SELECT'||n.querySelector('select')))go=true}));if(go)requestAnimationFrame(()=>ssScan())}).observe(document.body,{childList:true,subtree:true});
addEventListener('scroll',e=>{if(ssOpen&&!ssOpen.contains(e.target))ssPlace()},true);addEventListener('resize',ssPlace);

/* ---------- بث التغيير الفوري (اختياري): Firebase Realtime Database ----------
   Apps Script لا يدفع إشعارات للمتصفحات، لذلك نستخدم قناة إشعار خفيفة خارجه: كل متصفح ينفّذ عملية كتابة يرسل «علامة تغيير»
   إلى مسار v في قاعدة Firebase، وكل المتصفحات الأخرى (في أي مكان) تستمع إليه عبر EventSource فتتحدث خلال أقل من ثانية.
   العلامة لا تحمل أي بيانات، وكل متصفح يتحقق من رقم النسخة عبر ping قبل التحديث. بدون ضبط FB يعمل الفحص الدوري كما كان. */
const FBU=String(CFG.FB||'').trim().replace(/\/+$/,'');
let fbLast='',fbSeen=null,fbOpen=false,fbES=null;
function fbNotify(){
  if(!FBU)return;
  fbLast=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  try{fetch(FBU+'/v.json',{method:'PUT',body:JSON.stringify(fbLast),keepalive:true}).catch(()=>{})}catch(e){}
}
function fbStart(){
  if(!FBU||!window.EventSource||fbES)return;
  fbES=new EventSource(FBU+'/v.json');
  fbES.addEventListener('put',e=>{
    try{
      const d=JSON.parse(e.data);if(d.path!=='/')return;
      const v=d.data;
      if(fbSeen===null){fbSeen=v;return}
      if(v===fbSeen||v===fbLast){fbSeen=v;return}
      fbSeen=v;if(D.user)tick();
    }catch(x){}
  });
  fbES.onopen=()=>{if(fbOpen&&D.user)tick();fbOpen=true};
}
/* ---------- المزامنة الفورية بين المستخدمين ----------
   فحص خفيف (ping) كل بضع ثوانٍ؛ إن تغيّر رقم نسخة البيانات نحمّل أحدث البيانات فورًا.
   يتوقف مؤقتًا أثناء التحرير (نافذة مفتوحة أو حقل قيد الكتابة) ويُستأنف لحظة الانتهاء. */
let lastAct=Date.now(),pingBusy=false,pendingRemote=false;
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
const editing=()=>{if(dlg.open)return true;const a=document.activeElement;return !!(a&&a.closest&&a.closest('#v')&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&(a.type!=='search')&&a.getAttribute('placeholder')!=='بحث...')};
async function tick(){
  if(!D.user||document.hidden||pingBusy||nb>0)return;
  pingBusy=true;
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'ping',token:tok})});
    const j=await r.json();
    if(!j.ok){if(j.auth)out(true);return}
    pendingRemote=!!(D.v&&j.v!==D.v);
    if(pendingRemote&&!editing()&&!$('#sf')){await load(0);pendingRemote=false}
  }catch(e){/* انقطاع مؤقت: نحاول في الدورة التالية */}
  finally{pingBusy=false}
}
// 3 ثوانٍ أثناء النشاط، 15 ثانية بعد دقيقتين خمول، 60 ثانية بعد 10 دقائق (يوفّر حصة Apps Script اليومية)
(function loop(){const idle=Date.now()-lastAct,d=pendingRemote?2000:(FBU&&fbOpen)?(idle<12e4?20000:60000):(idle<12e4?3000:idle<6e5?15000:60000);setTimeout(async()=>{await tick();loop()},d)})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D.user)tick()});
</script>
